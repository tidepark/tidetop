# 태그를 올리면 실행 파일을 만들어 GitHub 릴리즈와 Homebrew tap 에 올리고, npm 에 올린다.
# 필요한 저장소 비밀값: HOMEBREW_TAP_TOKEN (tidepark/homebrew-tap 의 Contents 에 쓸 수 있는 토큰)
# npm 은 trusted publishing(OIDC)으로 올린다. 토큰이 없다. 저장소 변수 NPM_PUBLISH 가 true 일 때만 돈다.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm trusted publishing
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2.20"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/setup-node@v4
        if: vars.NPM_PUBLISH == 'true'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - if: vars.NPM_PUBLISH == 'true'
        run: npm install -g npm@11 # trusted publishing 은 npm 11.5.1 이상
      - if: vars.NPM_PUBLISH == 'true'
        run: node npm/build.mjs dist "${GITHUB_REF_NAME#v}" && node npm/publish.mjs
